services:
  - type: web
    name: azees-smart-tally-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/azees-smart-tally.sqlite
      - key: BACKUP_PATH
        value: /opt/render/project/src/data/backups
      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
